<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Klik · vidéo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0b0f0c; --bg2: #121813; --line: #263027;
    --ink: #eef3ee; --ink2: #8a988c; --accent: #34a65a; --accent-soft: #2b6b3f;
    --display: "Big Shoulders Display", Impact, sans-serif;
    --mono: "IBM Plex Mono", monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(900px 700px at 72% 50%, rgba(52,166,90,.13), transparent 70%),
                radial-gradient(600px 500px at 10% 100%, rgba(52,166,90,.06), transparent 70%);
  }

  /* ---------- chapitres ---------- */
  .chapters { position: absolute; left: 120px; top: 90px; display: flex; gap: 14px; opacity: 0; transition: opacity .6s; }
  .chapters.on { opacity: 1; }
  .chap { font: 600 17px var(--mono); letter-spacing: .04em; color: var(--ink2); border: 2px solid var(--line); border-radius: 999px; padding: 8px 18px; transition: all .4s; }
  .chap b { color: var(--ink2); margin-right: 8px; }
  .chap.on { color: #04140a; background: var(--accent); border-color: var(--accent); }
  .chap.on b { color: #04140a; }
  .chap.done { color: var(--ink); border-color: var(--accent-soft); }

  /* ---------- légende ---------- */
  .caption { position: absolute; left: 120px; top: 250px; width: 700px; }
  .caption .kicker { font: 600 22px var(--mono); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px; }
  .caption h1 { font: 900 96px/0.95 var(--display); text-transform: uppercase; margin: 0 0 28px; letter-spacing: .01em; }
  .caption p { font: 400 31px/1.42 var(--sans); color: #c9d3ca; margin: 0; max-width: 660px; }
  .caption p strong { color: var(--ink); font-weight: 600; }
  .caption p .k { font: 600 .9em var(--mono); color: var(--accent); }
  .caption > * { transition: opacity .45s ease, transform .55s cubic-bezier(.2,.7,.3,1); }
  .caption.out > * { opacity: 0; transform: translateY(-16px); }
  .caption.in > * { opacity: 0; transform: translateY(26px); }
  .caption.in > :nth-child(2) { transition-delay: .06s; }
  .caption.in > :nth-child(3) { transition-delay: .12s; }

  .legend { margin-top: 34px; display: grid; gap: 16px; }
  .legend div { display: flex; align-items: center; gap: 22px; font: 500 28px var(--sans); color: #c9d3ca; opacity: 0; transform: translateX(-14px); transition: all .45s; }
  .legend div.on { opacity: 1; transform: none; }
  .legend i { width: 44px; display: grid; place-items: center; flex: none; }
  .legend .dn { width: 26px; height: 26px; background: var(--ink); transform: rotate(45deg); border-radius: 4px; }
  .legend .st { width: 34px; height: 34px; background: var(--accent); border-radius: 50%; }
  .legend .md { width: 26px; height: 26px; background: var(--accent-soft); border: 3px solid var(--accent); border-radius: 50%; }
  .legend .no { width: 16px; height: 16px; border: 3px solid var(--ink2); border-radius: 50%; }
  .legend em { font-style: normal; color: var(--ink2); font-size: 23px; }

  /* ---------- téléphones ---------- */
  .phone { position: absolute; top: 100px; width: 414px; height: 868px; border-radius: 58px; padding: 12px;
    background: linear-gradient(145deg, #2b332d, #141a15 40%, #222a24);
    box-shadow: 0 0 0 2px #39433b, 0 40px 90px rgba(0,0,0,.6), 0 0 140px rgba(52,166,90,.12);
    transition: transform 1s cubic-bezier(.2,.7,.2,1), opacity .8s; }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 46px; display: block; background: var(--bg); }
  .phone .label { position: absolute; top: -52px; left: 0; right: 0; text-align: center; font: 600 20px var(--mono); color: var(--ink2); letter-spacing: .06em; opacity: 0; transition: opacity .5s; }
  .phone.labelled .label { opacity: 1; }
  #p1 { left: 1180px; }
  #p2 { left: 1380px; opacity: 0; transform: translateX(260px); }
  body.duo #p1 { transform: translateX(-280px); }
  body.duo #p2 { opacity: 1; transform: none; }
  body.intro .phone, body.outro .phone { transform: translateY(1100px); }

  /* ---------- message envoyé ---------- */
  .bubble { position: absolute; left: 1060px; top: 470px; width: 330px; padding: 18px 20px; border-radius: 22px 22px 22px 6px;
    background: #1f2a22; border: 2px solid var(--accent-soft); font: 500 20px/1.35 var(--sans); color: var(--ink);
    box-shadow: 0 20px 50px rgba(0,0,0,.55); opacity: 0; transform: scale(.6); z-index: 20; pointer-events: none; }
  .bubble small { display: block; font: 500 16px var(--mono); color: var(--accent); margin-top: 8px; word-break: break-all; }
  .bubble .who { font: 600 15px var(--mono); color: var(--ink2); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
  .bubble.go { animation: fly 2.6s cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes fly {
    0% { opacity: 0; transform: translate(0, 0) scale(.6); }
    18% { opacity: 1; transform: translate(0, -10px) scale(1); }
    55% { opacity: 1; transform: translate(0, -10px) scale(1); }
    100% { opacity: 0; transform: translate(500px, -60px) scale(.7); }
  }

  /* ---------- doigt ---------- */
  .touch { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none; z-index: 50;
    background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.85); box-shadow: 0 6px 24px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .18s, transform .18s, left .32s cubic-bezier(.3,.7,.3,1), top .32s cubic-bezier(.3,.7,.3,1); transform: scale(1.25); }
  .touch.on { opacity: 1; transform: scale(1); }
  .touch.press { transform: scale(.78); background: rgba(255,255,255,.45); }
  .ripple { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9);
    pointer-events: none; z-index: 49; animation: rip .55s ease-out forwards; }
  @keyframes rip { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.1); opacity: 0; } }

  /* ---------- titres plein écran ---------- */
  .card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 30; pointer-events: none; }
  .card > * { opacity: 0; transform: translateY(30px); transition: opacity .7s, transform .9s cubic-bezier(.2,.7,.2,1); }
  .card.on > * { opacity: 1; transform: none; }
  .card.on > :nth-child(2) { transition-delay: .15s; }
  .card.on > :nth-child(3) { transition-delay: .3s; }
  .card.on > :nth-child(4) { transition-delay: .45s; }
  .logo { width: 210px; height: 210px; margin: 0 auto 34px; border-radius: 50%; border: 6px solid var(--ink); display: grid; place-items: center; position: relative;
    font: 900 92px var(--display); }
  .logo::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; animation: beat 0.6s infinite; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 var(--accent), 0 0 0 0 rgba(64,196,108,.5); } 100% { box-shadow: 0 0 0 22px rgba(52,166,90,0), 0 0 60px 30px rgba(64,196,108,0); } }
  .card h2 { font: 900 150px/0.9 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .02em; }
  .card p { font: 400 38px/1.4 var(--sans); color: #c9d3ca; margin: 22px 0 0; }
  .card .url { font: 600 34px var(--mono); color: var(--accent); margin-top: 44px; }
  .card .chips { display: flex; gap: 16px; justify-content: center; margin-top: 40px; }
  .card .chips span { font: 600 22px var(--mono); border: 2px solid var(--accent-soft); border-radius: 999px; padding: 10px 22px; color: var(--ink); }
</style>
</head>
<body class="intro">
  <nav class="chapters" id="chapters">
    <span class="chap"><b>1</b>Pattern</span>
    <span class="chap"><b>2</b>Accents</span>
    <span class="chap"><b>3</b>Setlist</span>
    <span class="chap"><b>4</b>Partage</span>
  </nav>

  <section class="caption in" id="caption"><div class="kicker"></div><h1></h1><p></p></section>

  <div class="phone" id="p1"><div class="label">TOI</div><iframe id="f1" allow="autoplay"></iframe></div>
  <div class="phone" id="p2"><div class="label">LE BATTEUR</div><iframe id="f2" allow="autoplay"></iframe></div>

  <div class="bubble" id="bubble"><div class="who">Message · Groupe</div>« Fête de la musique » pour Klik<small>klik.lonoize.com/#k=eNqrVkrOz8…</small></div>

  <div class="card" id="intro">
    <div class="logo">K</div>
    <h2>Klik</h2>
    <p>Le tempo de référence pour ton groupe,<br>avant chaque morceau.</p>
  </div>
  <div class="card" id="outro">
    <div class="logo">K</div>
    <h2>Klik</h2>
    <p>Gratuit · hors-ligne · s'installe sur l'écran d'accueil</p>
    <div class="url">klik.lonoize.com</div>
  </div>

  <div class="touch" id="touch"></div>

<script>
  const $ = s => document.querySelector(s);
  window.stage = {
    load(id, src) { $('#' + id).src = src; },
    mode(cls) { document.body.className = cls; },
    card(id, on) { $('#' + id).classList.toggle('on', on); },
    chapter(n) {
      $('#chapters').classList.toggle('on', n > 0);
      [...document.querySelectorAll('.chap')].forEach((c, i) => {
        c.classList.toggle('on', i + 1 === n);
        c.classList.toggle('done', i + 1 < n);
      });
    },
    caption(kicker, title, body) {
      const c = $('#caption');
      c.classList.remove('in'); c.classList.add('out');
      setTimeout(() => {
        c.children[0].textContent = kicker;
        c.children[1].innerHTML = title;
        c.children[2].innerHTML = body;
        const old = c.querySelector('.legend'); if (old) old.remove();
        c.classList.remove('out'); c.classList.add('in');
        requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('in')));
      }, title ? 450 : 0);
    },
    legend() {
      const l = document.createElement('div');
      l.className = 'legend';
      l.innerHTML = `
        <div><i><span class="dn"></span></i>Temps 1 <em>— grave, tout le cercle flashe</em></div>
        <div><i><span class="st"></span></i>Fort <em>— aigu, grand halo</em></div>
        <div><i><span class="md"></span></i>Moyen <em>— aigu doux, petit halo</em></div>
        <div><i><span class="no"></span></i>Rien <em>— silence</em></div>`;
      $('#caption').append(l);
      [...l.children].forEach((d, i) => setTimeout(() => d.classList.add('on'), 300 + i * 450));
    },
    labels(on) { document.querySelectorAll('.phone').forEach(p => p.classList.toggle('labelled', on)); },
    bubble() { const b = $('#bubble'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); },
    touchMove(x, y) { const t = $('#touch'); t.style.left = x + 'px'; t.style.top = y + 'px'; t.classList.add('on'); },
    touchDown() { $('#touch').classList.add('press'); },
    touchUp(x, y) {
      const t = $('#touch'); t.classList.remove('press');
      const r = document.createElement('div'); r.className = 'ripple';
      r.style.left = t.style.left; r.style.top = t.style.top;
      document.body.append(r); setTimeout(() => r.remove(), 600);
    },
    touchHide() { $('#touch').classList.remove('on', 'press'); },
  };
</script>
</body>
</html>
