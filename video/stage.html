<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Klik · vidéo</title>
<!-- Format vertical 9:16 : la scène est dessinée en 720×1280 puis agrandie ×1,5 → 1080×1920. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0b0f0c; --line: #263027;
    --ink: #eef3ee; --ink2: #8a988c; --accent: #34a65a; --accent-soft: #2b6b3f;
    --display: "Big Shoulders Display", Impact, sans-serif;
    --mono: "IBM Plex Mono", monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  #root { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; transform: scale(1.5); transform-origin: 0 0; }
  #root::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(520px 640px at 50% 72%, rgba(52,166,90,.15), transparent 70%);
  }

  /* ---------- chapitres ---------- */
  .chapters { position: absolute; left: 0; right: 0; top: 26px; display: flex; justify-content: center; gap: 8px; }
  .chap { font: 600 15px var(--mono); color: var(--ink2); border: 2px solid var(--line); border-radius: 999px; padding: 5px 13px; transition: all .4s; }
  .chap.on { color: #04140a; background: var(--accent); border-color: var(--accent); }
  .chap.done { color: var(--ink); border-color: var(--accent-soft); }

  /* ---------- légende ---------- */
  .caption { position: absolute; left: 36px; right: 36px; top: 78px; height: 210px; text-align: center; z-index: 10; }
  .caption h1 { font: 900 64px/0.95 var(--display); text-transform: uppercase; margin: 0 0 12px; }
  .caption p { font: 500 27px/1.3 var(--sans); color: #d3dcd4; margin: 0; }
  .caption p strong { color: var(--ink); font-weight: 600; }
  .caption p .k { font: 600 .92em var(--mono); color: var(--accent); }
  .caption > * { transition: opacity .3s ease, transform .4s cubic-bezier(.2,.7,.3,1); }
  .caption.out > * { opacity: 0; transform: translateY(-12px); }
  .caption.in > * { opacity: 0; transform: translateY(18px); }
  .caption.in > :nth-child(2) { transition-delay: .05s; }

  .legend { display: flex; justify-content: center; gap: 24px; margin-top: 14px; }
  .legend div { display: flex; align-items: center; gap: 9px; font: 600 22px var(--sans); opacity: 0; transform: translateY(10px); transition: all .35s; }
  .legend div.on { opacity: 1; transform: none; }
  .legend i { height: 34px; display: grid; place-items: center; }
  .legend .dn { width: 22px; height: 22px; background: var(--ink); transform: rotate(45deg); border-radius: 3px; }
  .legend .st { width: 30px; height: 30px; background: var(--accent); border-radius: 50%; }
  .legend .md { width: 24px; height: 24px; background: var(--accent-soft); border: 3px solid var(--accent); border-radius: 50%; }
  .legend .no { width: 14px; height: 14px; border: 3px solid var(--ink2); border-radius: 50%; }
  .legend em { font: 500 17px var(--sans); font-style: normal; color: var(--ink2); margin-top: -6px; }

  /* ---------- téléphones ---------- */
  .phone { position: absolute; top: 300px; left: 153px; width: 414px; height: 868px; border-radius: 58px; padding: 12px;
    transform-origin: 0 0;
    background: linear-gradient(145deg, #2b332d, #141a15 40%, #222a24);
    box-shadow: 0 0 0 2px #39433b, 0 30px 70px rgba(0,0,0,.6), 0 0 120px rgba(52,166,90,.14);
    transition: transform .9s cubic-bezier(.2,.7,.2,1), opacity .7s; }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 46px; display: block; background: var(--bg); }
  .phone .label { position: absolute; top: -50px; left: 0; right: 0; text-align: center; font: 600 26px var(--mono); color: var(--accent); letter-spacing: .04em; opacity: 0; transition: opacity .5s; }
  .phone.labelled .label { opacity: 1; }
  #p2 { opacity: 0; transform: translate(560px, 70px) scale(.82); }
  #root.duo #p1 { transform: translate(-145px, 70px) scale(.82); }
  #root.duo #p2 { opacity: 1; transform: translate(207px, 70px) scale(.82); }

  /* ---------- message envoyé ---------- */
  .bubble { position: absolute; left: 40px; top: 760px; width: 300px; padding: 16px 18px; border-radius: 20px 20px 20px 6px;
    background: #1f2a22; border: 2px solid var(--accent); font: 600 21px/1.3 var(--sans); color: var(--ink);
    box-shadow: 0 20px 50px rgba(0,0,0,.6); opacity: 0; z-index: 20; pointer-events: none; }
  .bubble small { display: block; font: 500 16px var(--mono); color: var(--accent); margin-top: 6px; word-break: break-all; }
  .bubble .who { font: 600 14px var(--mono); color: var(--ink2); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  .bubble.go { animation: fly 2.2s cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes fly {
    0% { opacity: 0; transform: translate(0, 30px) scale(.6); }
    15% { opacity: 1; transform: translate(0, 0) scale(1); }
    55% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(360px, -40px) scale(.7); }
  }

  /* ---------- doigt ---------- */
  .touch { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none; z-index: 50;
    background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.85); box-shadow: 0 6px 24px rgba(0,0,0,.4);
    opacity: 0; transform: scale(1.25);
    transition: opacity .18s, transform .18s, left .28s cubic-bezier(.3,.7,.3,1), top .28s cubic-bezier(.3,.7,.3,1); }
  .touch.on { opacity: 1; transform: scale(1); }
  .touch.press { transform: scale(.78); background: rgba(255,255,255,.45); }
  .ripple { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9);
    pointer-events: none; z-index: 49; animation: rip .5s ease-out forwards; }
  @keyframes rip { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.1); opacity: 0; } }

  /* ---------- fin ---------- */
  .card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 30; pointer-events: none;
    background: rgba(11,15,12,.0); transition: background .6s; }
  .card.on { background: rgba(11,15,12,.94); }
  .card > * { opacity: 0; transform: translateY(24px); transition: opacity .5s, transform .7s cubic-bezier(.2,.7,.2,1); }
  .card.on > * { opacity: 1; transform: none; }
  .card.on > :nth-child(2) { transition-delay: .1s; }
  .card.on > :nth-child(3) { transition-delay: .2s; }
  .card.on > :nth-child(4) { transition-delay: .3s; }
  .logo { width: 170px; height: 170px; margin: 0 auto 26px; border-radius: 50%; border: 6px solid var(--ink); display: grid; place-items: center; position: relative; font: 900 80px var(--display); }
  .logo::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; animation: beat .6s infinite; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 var(--accent), 0 0 0 0 rgba(64,196,108,.5); } 100% { box-shadow: 0 0 0 20px rgba(52,166,90,0), 0 0 50px 26px rgba(64,196,108,0); } }
  .card h2 { font: 900 130px/0.9 var(--display); margin: 0; text-transform: uppercase; }
  .card p { font: 500 30px/1.4 var(--sans); color: #d3dcd4; margin: 18px 0 0; }
  .card .url { font: 600 32px var(--mono); color: var(--accent); margin-top: 34px; }
</style>
</head>
<body>
<div id="root">
  <nav class="chapters" id="chapters">
    <span class="chap">1 Tempo</span>
    <span class="chap">2 Accents</span>
    <span class="chap">3 Setlist</span>
    <span class="chap">4 Partage</span>
  </nav>

  <section class="caption" id="caption"><h1></h1><p></p></section>

  <div class="phone" id="p1"><div class="label">TOI</div><iframe id="f1" allow="autoplay"></iframe></div>
  <div class="phone" id="p2"><div class="label">LE BATTEUR</div><iframe id="f2" allow="autoplay"></iframe></div>

  <div class="bubble" id="bubble"><div class="who">Message · Le groupe</div>« Bal du samedi » pour Klik<small>klik.lonoize.com/#k=zTY6xDo…</small></div>

  <div class="card" id="outro">
    <div class="logo">K</div>
    <h2>Klik</h2>
    <p>Gratuit · hors-ligne<br>s'installe sur l'écran d'accueil</p>
    <div class="url">klik.lonoize.com</div>
  </div>

  <div class="touch" id="touch"></div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const ZOOM = 1.5;   // coordonnées de la souris (px de l'écran) → px de la scène
  window.stage = {
    load(id, src) { $('#' + id).src = src; },
    mode(cls) { $('#root').className = cls; },
    card(id, on) { $('#' + id).classList.toggle('on', on); },
    chapter(n) {
      [...document.querySelectorAll('.chap')].forEach((c, i) => {
        c.classList.toggle('on', i + 1 === n);
        c.classList.toggle('done', i + 1 < n);
      });
    },
    caption(title, body, legend) {
      const c = $('#caption');
      const show = () => {
        c.children[0].innerHTML = title;
        c.children[1].innerHTML = body;
        const old = c.querySelector('.legend'); if (old) old.remove();
        if (legend) {
          const l = document.createElement('div');
          l.className = 'legend';
          l.innerHTML = `
            <div><i><span class="dn"></span></i>Temps 1</div>
            <div><i><span class="st"></span></i>Fort</div>
            <div><i><span class="md"></span></i>Moyen</div>
            <div><i><span class="no"></span></i>Rien</div>`;
          c.append(l);
          [...l.children].forEach((d, i) => setTimeout(() => d.classList.add('on'), 250 + i * 220));
        }
        c.classList.remove('out'); c.classList.add('in');
        requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('in')));
      };
      if (!c.children[0].innerHTML) { show(); return; }
      c.classList.add('out');
      setTimeout(show, 300);
    },
    labels(on) { document.querySelectorAll('.phone').forEach(p => p.classList.toggle('labelled', on)); },
    bubble() { const b = $('#bubble'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); },
    touchMove(x, y) { const t = $('#touch'); t.style.left = x / ZOOM + 'px'; t.style.top = y / ZOOM + 'px'; t.classList.add('on'); },
    touchDown() { $('#touch').classList.add('press'); },
    touchUp() {
      const t = $('#touch'); t.classList.remove('press');
      const r = document.createElement('div'); r.className = 'ripple';
      r.style.left = t.style.left; r.style.top = t.style.top;
      $('#root').append(r); setTimeout(() => r.remove(), 550);
    },
    touchHide() { $('#touch').classList.remove('on', 'press'); },
  };
</script>
</body>
</html>
