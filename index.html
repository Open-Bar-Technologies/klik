<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Klik</title>
  <meta name="description" content="Tempo de référence pour le groupe, avec setlists par concert.">
  <meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klik">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app">
    <nav class="top" aria-label="Signature et concerts">
      <div class="sigs" id="sigs"></div>
      <button class="square" id="openLibrary" type="button" aria-label="Concerts et morceaux">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      </button>
    </nav>

    <section class="center" id="center">
      <div class="song" id="song">
        <button class="nav" id="prev" type="button" aria-label="Morceau précédent">‹</button>
        <button class="title" id="songTitle" type="button" aria-label="Ouvrir la liste des morceaux"></button>
        <button class="nav" id="next" type="button" aria-label="Morceau suivant">›</button>
      </div>
      <div class="ring" id="ring">
        <div class="points" id="points"></div>
        <div class="disc" id="disc">
          <button class="mute" id="mute" type="button">🔊</button>
          <button class="bpm" id="bpm" type="button" aria-label="Tempo. Toucher pour lancer ou arrêter, toucher deux fois pour saisir.">120</button>
          <input class="bpm-input" id="bpmInput" type="number" inputmode="numeric" min="30" max="300" aria-label="Saisir le tempo" hidden>
          <button class="play" id="play" type="button" aria-label="Lancer"><span class="play-icon" aria-hidden="true"></span></button>
        </div>
      </div>
    </section>

    <div class="slider">
      <div class="track" id="track" aria-hidden="true">
        <span class="mark">«</span><span class="mark">‹</span><span class="gap"></span><span class="mark">›</span><span class="mark">»</span>
      </div>
      <button class="knob" id="tap" type="button" aria-label="Tap tempo. Maintenir et glisser pour changer le tempo.">
        <span>TAP</span>
        <span class="tap-dots" id="tapDots"><i></i><i></i><i></i><i></i></span>
      </button>
    </div>
  </main>

  <section class="lib" id="lib" hidden>
    <header class="lib-head">
      <button class="lib-icon" id="libBack" type="button" aria-label="Retour aux concerts" hidden>‹</button>
      <h1 id="libTitle">Concerts</h1>
      <button class="lib-icon" id="libClose" type="button" aria-label="Fermer">✕</button>
    </header>
    <div class="lib-body" id="libBody"></div>
    <footer class="lib-foot" id="libFoot"></footer>
  </section>

  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <button class="update" id="update" type="button" hidden>Nouvelle version disponible · Mettre à jour</button>

  <script src="version.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
